name: Validate CATI Observatory
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install -r requirements.txt
      - run: python3 -m scripts.check_reference
      - run: python3 build.py
      - run: python3 verify.py
      - run: python3 -m unittest tests.test_trade_history tests.test_service_registry tests.test_refresh_sources
      - run: node --check web/app.js
      - run: node --test tests/market-cap.test.cjs tests/snapshot-loader.test.cjs
